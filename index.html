<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human Body Explorer</title>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --text: #0f172a; --muted: #64748b;
    --border: #e2e8f0; --body-fill: #f1e4d8; --body-stroke: #c8ad96;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1120; --panel: #111827; --text: #e5e7eb; --muted: #94a3b8;
      --border: #1f2937; --body-fill: #2a2420; --body-stroke: #5b4a3d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; max-width: 1100px; margin: 0 auto; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .9rem; display: flex; align-items: center; gap: 6px; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; }
  .chip.active { outline: 2px solid currentColor; }
  main { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 20px;
    max-width: 1100px; margin: 0 auto; padding: 8px 16px 32px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .figure { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px; }
  svg { width: 100%; height: auto; display: block; }
  .organ { cursor: pointer; opacity: .85; transition: opacity .15s, transform .15s; stroke: rgba(0,0,0,.25); stroke-width: 1; }
  .organ:hover, .organ:focus { opacity: 1; stroke-width: 2.5; outline: none; }
  .organ.selected { opacity: 1; stroke: var(--text); stroke-width: 3; }
  .organ.dim { opacity: .12; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .panel h2 { margin: 0 0 4px; }
  .tag { display: inline-block; font-size: .8rem; padding: 2px 10px; border-radius: 999px; color: #fff; margin-bottom: 12px; }
  .meta { color: var(--muted); margin: 0 0 12px; }
  .list { display: grid; gap: 6px; margin-top: 16px; }
  .list button { text-align: left; border: 1px solid var(--border); background: transparent; color: var(--text);
    padding: 8px 10px; border-radius: 10px; cursor: pointer; }
  .list button:hover { background: rgba(127,127,127,.08); }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 16px 24px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<header>
  <h1>Human Body Explorer</h1>
  <p>Tap an organ to learn what it does. Filter by body system.</p>
</header>
<div class="filters" id="filters"></div>
<main>
  <div class="figure">
    <svg viewBox="0 0 400 760" role="img" aria-label="Human body diagram">
      <g fill="var(--body-fill)" stroke="var(--body-stroke)" stroke-width="2">
        <ellipse cx="200" cy="70" rx="48" ry="56"/>
        <rect x="182" y="120" width="36" height="30" rx="8"/>
        <path d="M120 155 C150 145 250 145 280 155 C300 165 305 200 300 260 L290 420 C285 470 270 510 255 520 L145 520 C130 510 115 470 110 420 L100 260 C95 200 100 165 120 155 Z"/>
        <path d="M118 160 C95 170 85 200 80 260 L68 400 C66 420 82 424 86 404 L104 270 Z"/>
        <path d="M282 160 C305 170 315 200 320 260 L332 400 C334 420 318 424 314 404 L296 270 Z"/>
        <path d="M148 515 L196 515 L190 730 C189 745 160 745 160 730 Z"/>
        <path d="M204 515 L252 515 L240 730 C239 745 210 745 210 730 Z"/>
      </g>
      <g id="organs"></g>
    </svg>
  </div>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>
<footer>General educational information only. It is not medical advice. Talk to a qualified health professional about any health concern.</footer>
<script src="data/organs.js"></script>
<script src="app.js"></script>
</body>
</html>
